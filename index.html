<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --p:#921C95; --p-dark:#6E1471; --p-deep:#1C1632; --p-soft:#F5F4FE; --p-line:#E4DEF3; --p-tint:#F1E4F2;
  --o:#FFA022; --o-dark:#B86A00; --o-soft:#FFF3E0;
  --ink:#1F1B2D; --ink2:#4A4560; --ink3:#6E6985;
  --red:#C62828; --red-soft:#FDECEC; --amber:#9A5B00; --amber-soft:#FFF4DC; --green:#2E7D4F; --green-soft:#E6F4EC; --blue:#2457A6; --blue-soft:#E8F0FB;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--p-soft);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;font-size:15px;line-height:1.6}
a{color:var(--p)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header.top{background:var(--p);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(60,10,62,.18)}
.top .bar{display:flex;align-items:center;gap:18px;min-height:68px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff}
.brand img{height:42px;width:auto;display:block}
.brand .sep{width:1px;height:34px;background:rgba(255,255,255,.35)}
.brand .name{display:flex;flex-direction:column;line-height:1.2}
.brand .name b{font-size:21px;letter-spacing:3px;font-family:"Songti SC","STSong","Noto Serif SC",serif}
.brand .name span{font-size:12px;opacity:.85;letter-spacing:1px}
.roles{margin-left:auto;display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.roles button{border:0;background:transparent;color:#fff;padding:7px 16px;border-radius:999px;cursor:pointer;font-size:14px;min-height:36px}
.roles button.on{background:#fff;color:var(--p);font-weight:700}
nav.sub{background:var(--p-dark)}
nav.sub .wrap{display:flex;gap:4px;overflow-x:auto}
nav.sub a{color:#F3DDF4;text-decoration:none;padding:11px 16px;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav.sub a.on{color:#fff;border-bottom-color:var(--o);font-weight:700}
.notice{background:var(--o-soft);color:var(--o-dark);font-size:14px;border-radius:12px;padding:12px 16px;margin-bottom:18px}
.roles[hidden]{display:none}

main{padding:28px 0 60px}
h1,h2,h3{margin:0;line-height:1.3}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-title h2{font-size:24px}
.page-title p{margin:4px 0 0;color:var(--ink3)}
.card{background:#fff;border:1px solid var(--p-line);border-radius:var(--r);padding:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.roles{margin-left:0}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:600;text-decoration:none;font-size:15px}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--p-dark)}
.btn-o{background:var(--o);color:#3E2600}.btn-o:hover{background:#F08F00}
.btn-g{background:#fff;color:var(--p);border-color:var(--p-line)}.btn-g:hover{border-color:var(--p)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* hero */
.hero{background:var(--p-deep);color:#fff;border-radius:20px;padding:44px 40px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center;overflow:hidden;position:relative}
.hero:before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:2px solid rgba(255,160,34,.25)}
.hero h1{font-size:40px;letter-spacing:4px;font-family:"Songti SC","STSong","Noto Serif SC",serif}
.hero h1 em{font-style:normal;color:var(--o)}
.hero p{color:#D9D3EA;font-size:16px;margin:14px 0 26px;max-width:520px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.promise{display:grid;gap:12px;position:relative}
.promise div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.promise b{display:block;color:#fff}
.promise span{color:#CFC8E2;font-size:13px}
.promise svg{flex-shrink:0;color:var(--o);margin-top:3px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);padding:30px 22px}.hero h1{font-size:30px}.hero h1 em{font-size:23px;letter-spacing:2px}}

.entry{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.entry:hover{border-color:var(--p)}
.entry .ic{width:46px;height:46px;border-radius:12px;background:var(--p-tint);color:var(--p);display:flex;align-items:center;justify-content:center}
.entry.alert .ic{background:var(--red-soft);color:var(--red)}
.entry h3{font-size:18px}
.entry p{margin:0;color:var(--ink3);font-size:14px}

.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.steps div{padding:14px 12px;border-top:3px solid var(--p-line);position:relative}
.steps div.on{border-top-color:var(--p)}
.steps b{display:block;font-size:15px}
.steps span{font-size:13px;color:var(--ink3)}
@media (max-width:860px){.steps{grid-template-columns:minmax(0,1fr)}}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--ink3)}
input[type=text],input[type=tel],select,textarea{border:1px solid #CFC8E2;border-radius:10px;padding:10px 12px;background:#fff;min-height:44px;width:100%}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(146,28,149,.35);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #CFC8E2;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;font-size:14px}
.chip.on{border-color:var(--p);background:var(--p);color:#fff}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--p)}
.note{background:var(--p-tint);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink2)}
.note.warn{background:var(--red-soft);color:#7A1A1A}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.lv-urgent{background:var(--red-soft);color:var(--red)}
.lv-key{background:var(--amber-soft);color:var(--amber)}
.lv-normal{background:var(--blue-soft);color:var(--blue)}
.st-wait{background:#EEE;color:#555}
.st-doing{background:var(--o-soft);color:var(--o-dark)}
.st-done{background:var(--green-soft);color:var(--green)}
.tag{background:var(--p-soft);color:var(--ink2);border:1px solid var(--p-line)}

/* list & detail */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select{width:auto;min-width:160px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--p-line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--p)}
.item.sel{border-color:var(--p);box-shadow:0 0 0 2px rgba(146,28,149,.15)}
.item .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink3)}
.item .txt{grid-column:1/-1;color:var(--ink2);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.due{font-size:13px;font-weight:700;white-space:nowrap}
.due.late{color:var(--red)}.due.soon{color:var(--amber)}.due.ok{color:var(--green)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:960px){.split{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:14px 0}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--p-line);margin-left:6px}
.timeline li{position:relative;padding:0 0 14px 18px;font-size:14px}
.timeline li:before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--p)}
.timeline li.sys:before{border-color:var(--o)}
.timeline time{display:block;font-size:12px;color:var(--ink3)}
.box{border:1px solid var(--p-line);border-radius:12px;padding:14px;margin-top:14px}
.box h4{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hidden-content{background:repeating-linear-gradient(45deg,#F7F5FC,#F7F5FC 8px,#EFEBF8 8px,#EFEBF8 16px);border-radius:10px;padding:14px;color:var(--ink3);font-size:14px}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;cursor:pointer;padding:2px;min-width:40px;min-height:40px;color:#D6CFE6}
.stars button.on{color:var(--o)}

/* dashboard */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi span{color:var(--ink3);font-size:13px}
.kpi b{font-size:30px;line-height:1.1;color:var(--p-deep)}
.kpi small{color:var(--ink3);font-size:12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:108px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.bars .track{background:var(--p-soft);border-radius:6px;height:16px;overflow:hidden}
.bars .fill{background:var(--p);height:100%;border-radius:6px}
.bars .n{text-align:right;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--p-line);vertical-align:top}
th{color:var(--ink3);font-weight:600;font-size:13px;background:#FBFAFE}
.tbl{overflow-x:auto}
footer{color:var(--ink3);font-size:13px;text-align:center;padding:24px 0 40px}

/* dialog */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--p-deep);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(28,22,50,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal{background:#fff;border-radius:18px;padding:28px;max-width:440px;width:100%;text-align:center}
.modal .code{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--p);background:var(--p-soft);border-radius:12px;padding:12px;margin:14px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.empty{text-align:center;color:var(--ink3);padding:40px 10px}

:root{--text-muted:#625b73}
header .top-links{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.top-links a{color:white;text-decoration:none;padding:6px 12px;border-radius:20px;font-size:14px}
.top-links a[aria-current=page]{background:#ffffff25;box-shadow:inset 0 0 0 1px #ffffff60}
.top-links a:hover{background:#ffffff20}

.paths{margin-top:20px}.hero:before{pointer-events:none}.hero>div{position:relative}
.service-state{display:inline-flex;align-items:center;gap:8px;padding:4px 11px;border-radius:99px;background:#ffffff12;color:#f4eaf3;font-size:13px;margin-bottom:14px}
.service-state:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--o)}
.hero .intro{margin:13px 0 21px}.hero h1{max-width:100%}
.page-title{align-items:center}.panel-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.panel-head i{width:38px;height:38px;border-radius:10px;background:var(--p-tint);color:var(--p);display:grid;place-items:center;font-style:normal}

.service-call{color:var(--p-dark);text-decoration:none;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.service-call:hover,.service-call:focus-visible{text-decoration:underline}.hot-card .service-call{font-size:clamp(21px,3vw,28px);letter-spacing:.5px}
.call-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 24px}
.call-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--p-line);min-height:50px}
.service-info{margin:21px 0 0;padding-top:15px;border-top:1px solid var(--p-line);font-size:14px;color:var(--text-muted)}
.reach{margin-top:18px}.restrict{max-width:760px}.restrict .btn,.receipt .btn{margin:10px 8px 0 0}
.kicker{margin:0 0 9px;color:var(--p-dark);letter-spacing:1px;font-size:12px;font-weight:700}
.account-nav{display:flex;align-items:center;gap:8px}.account-nav button{background:transparent;border:1px solid #ffffff65;border-radius:99px;padding:5px 12px;color:#fff;cursor:pointer}
.form-panel{max-width:780px}.login-card{max-width:460px}.login-card input{border:1px solid #c7c1d6;border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field input:not([type=checkbox]),.field select,.field textarea{min-width:0;width:100%;max-width:100%}
.field textarea{min-height:116px}.err{color:#9f2020;margin:8px 0 10px;white-space:pre-line}.err:empty{display:none}
.case-text{white-space:pre-wrap;overflow-wrap:anywhere}.case-line{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.list .item{text-decoration:none;color:inherit}.receipt .code{font-size:23px;color:var(--p);font-weight:750;overflow-wrap:anywhere}
.ticket-stack{display:grid;gap:15px}.empty h3{color:var(--ink);margin-bottom:6px}.steps{margin-top:14px}
@media(max-width:880px){.call-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.wrap{padding-left:14px;padding-right:14px}.top .bar{gap:7px 12px}.brand{gap:9px}.brand .name b{font-size:19px}.brand .name span{font-size:10px}.brand img{height:32px;max-width:44vw;object-fit:contain}.top-links a{font-size:12px;padding:4px 9px}header .top-links{margin-left:0}.account-nav{margin-left:auto}.account-nav button{font-size:12px}.call-list{grid-template-columns:minmax(0,1fr)}.call-row{min-height:46px}.card{padding:17px}nav.sub a{padding:8px 10px}main{padding:17px 0 25px}.hero{padding:25px 20px}.hero h1 em{font-size:21px}.item{display:flex;flex-wrap:wrap}.page-title{gap:8px}.hero .intro{font-size:15px}}
</style></head><body>

  const routes={home:"首页",submit:"我要反映",track:"我的诉求",help:"紧急求助",rules:"平台规则",todo:"处置工作台",dash:"管理工作台",login:"账号登录"};
  const backend=window.lxqAccount||null;
  const contactCards=()=>`<div class="grid g2"><section class="card hot-card"><div class="panel-head"><i>${ICON.phone}</i><h3>保安室</h3></div><p class="help-line">校园安全及现场求助</p>${phoneLink(phones[0])}</section>
    <section class="card hot-card"><div class="panel-head"><i>${ICON.people}</i><h3>心理健康教育中心</h3></div><p class="help-line">校内心理支持与咨询</p>${phoneLink(phones[1])}</section></div>
    <section class="card reach"><div class="panel-head"><h3>公寓值班室</h3></div><div class="call-list">${phones.slice(2).map(row=>`<div class="call-row"><span>${row[0]}</span>${phoneLink(row)}</div>`).join("")}</div></section>`;
  function home(){
    return `<section class="hero"><div><div class="service-state">${backend?"账号服务":"校内服务 · 线上受理暂未开放"}</div>
      <h1>连心桥<br><em>有事说出来，件件有回音</em></h1>
      <p class="intro">学生社区诉求登记、办理进度查询及校内服务电话。</p>
      <div class="cta"><a class="btn btn-o" href="#submit">${ICON.write} 提交</a><a class="btn btn-g" href="#track">${ICON.search} 我的诉求</a></div></div>
      <div class="promise"><div>${ICON.write}<p style="margin:0"><b>分类反映</b><span>住宿生活、同学关系、学业就业与后勤服务</span></p></div>
      <div>${ICON.clock}<p style="margin:0"><b>办理进度</b><span>按编号查看受理状态、处理记录和回复</span></p></div>
      <div>${ICON.phone}<p style="margin:0"><b>校内联系</b><span>保安室、心理健康教育中心和各公寓值班室</span></p></div></div></section>
      <div class="grid g3 paths"><a class="card entry" href="#submit"><span class="ic">${ICON.write}</span><h3>我要反映</h3><p>登记事项类别、所在楼栋及具体情况。</p></a>
      <a class="card entry" href="#track"><span class="ic">${ICON.search}</span><h3>我的诉求</h3><p>查询本人事项的办理进度和处理结果。</p></a>
      <a class="card entry alert" href="#help"><span class="ic">${ICON.phone}</span><h3>紧急求助</h3><p>查看校园安全、心理支持及公寓联系电话。</p></a></div>`;
  }
  function help(){
    return `${pageTitle("紧急求助","如有人身危险或需要紧急救助，请立即向现场人员或当地紧急服务求助，不要等待线上回复。")}${contactCards()}`;
  }
  function rules(){
    return `${pageTitle("平台规则")}<div class="grid g2"><section class="card"><h3>受理范围</h3><p>学生社区住宿生活、同学关系、学业就业、心理支持、后勤事务与意见建议。</p><p class="muted">紧急事项请直接联系现场值班人员或当地紧急服务。</p><a href="#help">查询校内电话</a></section>
      <section class="card"><h3>信息填写</h3><p>请写明与事项有关的地点、情况和需要的帮助。请勿填写身份证号、病历、他人联系方式等无关信息。</p><p class="muted">使用个人账号查看本人的编号及办理记录。</p></section></div>
      <section class="card reach"><h3>办理流程</h3><div class="steps"><div class="on"><b>1 提交</b><span>登记事项，取得编号</span></div><div><b>2 受理</b><span>工作人员核对情况</span></div><div><b>3 跟进</b><span>补充情况，查看回复</span></div><div><b>4 办结</b><span>记录处理结果</span></div><div><b>5 评价</b><span>反馈办理情况</span></div></div></section>`;
  }
  function unavailable(route){
    const person=route==="todo"||route==="dash";
    return `${pageTitle(routes[route]||"账号服务")}<section class="card restrict"><p class="kicker">服务状态</p><h3>${person?"工作台暂未对外开放":"线上受理暂未开放"}</h3><p>如需反映问题，请联系所在公寓值班室或相关部门。此页面不会收取账号、密码或诉求内容。</p><a class="btn btn-p" href="#help">查看校内电话</a><a class="btn btn-g" href="#home">返回首页</a></section>`;
  }
  let revision=0;
  async function render(){
    const current=++revision;
    const parts=location.hash.slice(1).split("/");
    const route=Object.prototype.hasOwnProperty.call(routes,parts[0])?parts[0]:"home";
    const main=byId("view");
    document.querySelectorAll("header a[data-page]").forEach(link=>{
      const active=link.dataset.page===route||(link.dataset.page==="home"&&link.closest(".top-links")&&!["todo","dash"].includes(route));
      if(active)link.setAttribute("aria-current","page");else link.removeAttribute("aria-current");
    });
    const user=backend?backend.current():null;
    byId("accountNav").innerHTML=user?`<button type="button" id="signOut">退出登录</button>`:"";
    if(user)byId("signOut").addEventListener("click",async()=>{await backend.logout();if(location.hash==="#home")render();else location.hash="home";});
    if(route==="home")main.innerHTML=home();
    else if(route==="help")main.innerHTML=help();
    else if(route==="rules")main.innerHTML=rules();
    else if(!backend)main.innerHTML=unavailable(route);
    else await backend.draw(route,parts[1]||"",{main,escapeText,pageTitle,categories,render,alive:()=>revision===current});
    if(revision===current)window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",render);render();
})();
</script></body></html>
