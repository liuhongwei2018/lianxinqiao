<style>

  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--p-soft);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;font-size:15px;line-height:1.6}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

.brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff}

.brand .sep{width:1px;height:34px;background:rgba(255,255,255,.35)}
.brand .name{display:flex;flex-direction:column;line-height:1.2}

.roles{margin-left:auto;display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}

.notice{background:var(--o-soft);color:var(--o-dark);font-size:14px;border-radius:12px;padding:12px 16px;margin-bottom:18px}

main{padding:28px 0 60px}
h1,h2,h3{margin:0;line-height:1.3}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:600;text-decoration:none;font-size:15px}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--p-dark)}

.hero h1 em{font-style:normal;color:var(--o)}

.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.promise{display:grid;gap:12px;position:relative}

.entry.alert .ic{background:var(--red-soft);color:var(--red)}
.entry h3{font-size:18px}
.entry p{margin:0;color:var(--ink3);font-size:14px}

.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.steps div{padding:14px 12px;border-top:3px solid var(--p-line);position:relative}

input[type=text],input[type=tel],select,textarea{border:1px solid #CFC8E2;border-radius:10px;padding:10px 12px;background:#fff;min-height:44px;width:100%}

.lv-normal{background:var(--blue-soft);color:var(--blue)}

.st-doing{background:var(--o-soft);color:var(--o-dark)}

.tag{background:var(--p-soft);color:var(--ink2);border:1px solid var(--p-line)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

.item .txt{grid-column:1/-1;color:var(--ink2);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.due{font-size:13px;font-weight:700;white-space:nowrap}
.due.late{color:var(--red)}.due.soon{color:var(--amber)}.due.ok{color:var(--green)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}

.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:14px 0}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--p-line);margin-left:6px}
.timeline li{position:relative;padding:0 0 14px 18px;font-size:14px}
.timeline li:before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--p)}
.timeline li.sys:before{border-color:var(--o)}
.timeline time{display:block;font-size:12px;color:var(--ink3)}
.box{border:1px solid var(--p-line);border-radius:12px;padding:14px;margin-top:14px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.stars{display:flex;gap:6px}

.stars button.on{color:var(--o)}

/* dashboard */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi span{color:var(--ink3);font-size:13px}
.kpi b{font-size:30px;line-height:1.1;color:var(--p-deep)}
.kpi small{color:var(--ink3);font-size:12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:108px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.bars .track{background:var(--p-soft);border-radius:6px;height:16px;overflow:hidden}
.bars .fill{background:var(--p);height:100%;border-radius:6px}
.bars .n{text-align:right;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--p-line);vertical-align:top}
th{color:var(--ink3);font-weight:600;font-size:13px;background:#FBFAFE}
.tbl{overflow-x:auto}
footer{color:var(--ink3);font-size:13px;text-align:center;padding:24px 0 40px}

/* dialog */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--p-deep);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(28,22,50,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal{background:#fff;border-radius:18px;padding:28px;max-width:440px;width:100%;text-align:center}
.modal .code{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--p);background:var(--p-soft);border-radius:12px;padding:12px;margin:14px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.empty{text-align:center;color:var(--ink3);padding:40px 10px}
.receipt{border:1px solid var(--p-line);color:var(--ink);width:min(440px,calc(100% - 32px));box-shadow:0 20px 60px #1c16323b}.receipt::backdrop{background:#1c16328c}.receipt h3{margin:6px 0 0}.receipt p{color:var(--ink2)}
.edition{font:600 11px/1.5 system-ui,sans-serif;letter-spacing:0;color:#fff1dc;background:#ffffff20;border:1px solid #ffffff70;border-radius:5px;padding:1px 5px;vertical-align:middle;white-space:nowrap}
.demo-strip{background:#fff9ef;border-bottom:1px solid #eedfc8;color:#634a32;font-size:13px}
.demo-strip .wrap{display:flex;gap:5px 12px;align-items:center;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.demo-strip strong{color:#733e0a}.demo-strip span{color:#665951}
.sample-card{background:var(--p-soft);border-left:3px solid var(--p);border-radius:0 10px 10px 0;padding:14px 16px;margin:4px 0 0;color:var(--ink2)}
.sample-card strong{color:var(--p-dark);display:block;margin-bottom:4px}.sample-card p{margin:0}
.sample-steps{padding-left:22px;color:var(--ink2)}.sample-steps li{padding:3px 0 10px}
.field select{min-width:0;max-width:100%}.split>*,.grid>*{min-width:0}
.desk-label{font-size:13px;color:var(--p-dark);background:var(--p-tint);border-radius:999px;padding:3px 10px;display:inline-block}
.hero:before{pointer-events:none}.modal{max-height:90vh;overflow:auto}
@media(max-width:600px){.wrap{padding-left:14px;padding-right:14px}.top .bar{gap:7px 14px}.brand{gap:9px}.brand img{height:32px;max-width:44vw;object-fit:contain}.brand .name b{font-size:18px}.brand .name span{font-size:10px}.roles button{font-size:12px;padding:4px 12px;min-height:32px}nav.sub a{padding:8px 10px}.demo-strip .wrap{gap:2px 8px}.demo-strip span{font-size:12px}main{padding-top:16px}.toolbar select{min-width:120px}.item{display:flex;flex-wrap:wrap;align-items:center}.item .txt{width:100%}.modal .code{font-size:23px}.card{padding:17px}.page-title{align-items:flex-start}}
</style>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const H=3600e3, D=24*H;
const CATS=[
  {k:"live",n:"宿舍生活",d:"作息、卫生、噪音、费用分摊等"},
  {k:"rel",n:"同学关系",d:"争吵、冷战、孤立、网络摩擦等"},
  {k:"study",n:"学业就业",d:"考核、评优、实习就业压力等"},
  {k:"mood",n:"心情困扰",d:"孤独、焦虑、情绪低落等"},
  {k:"logi",n:"后勤管理",d:"维修、水电网络、门禁查寝等"},
  {k:"idea",n:"意见建议",d:"对社区建设的想法和建议"}
];
const CATN=Object.fromEntries(CATS.map(c=>[c.k,c.n]));
const BUILDINGS=["1号公寓楼","2号公寓楼","3号公寓楼","4号公寓楼","5号公寓楼","6号公寓楼"];
const GRADES=["大一","大二","大三","大四"];
const LV={urgent:{n:"紧急处置",resp:1,res:72},key:{n:"重点关注",resp:24,res:168},normal:{n:"一般关注",resp:48,res:168}};
const LV_RANK={normal:0,key:1,urgent:2};
const ROLES={grid:{n:"楼栋网格员"},counselor:{n:"辅导员"},party:{n:"楼栋党建工作站"},psych:{n:"心理教师"},logistics:{n:"后勤宿管"},office:{n:"工作专班"}};
const KW_URGENT=["自杀","不想活","轻生","割腕","跳楼","寻死","结束生命","打架","动手打","被打","刀","威胁","偷","被盗","伤害"];
const KW_KEY=["失眠","崩溃","绝望","撑不住","孤立","排挤","霸凌","针对我","吵架","冲突","辱骂","抑郁","焦虑"];
const METHODS=["分别谈话","双方当面沟通","调整宿舍","心理疏导","朋辈调解","维修/服务改进","政策解释","转介其他部门"];
const EXAMPLES={
  logi:[["走廊照明","晚自习回来，楼梯转角的感应灯总要走近才亮。能不能把感应范围调大一些？"],["饮水机接水慢","晚饭后大家在饮水机前排队，热水出得很慢，希望后勤看看滤芯。"]],
  live:[["洗衣房排队","周末晚上总有人在洗衣房等，想试试在门口贴一张空闲时段表。"],["熄灯后的声音","熄灯后洗漱区的关门声比较响，想和楼层同学商量一个安静时段。"]],
  rel:[["小组分工","做小组作业时大家对分工看法不一样，希望有人帮忙约一次讨论。"],["公共桌的使用","室友都想用靠窗的公共桌，想听听大家有什么轮流使用的办法。"]],
  study:[["实习材料找不到","准备实习时找了几处公告，都没找到最新版清单，想知道应该到哪里看。"],["复习计划","几门课的复习撞在一起，最近有些焦虑，希望有人帮忙理一理时间表。"]],
  mood:[["刚搬进新宿舍","刚搬进新宿舍，对周围还不熟悉，想参加一场人数不多的交流活动。"],["上台前紧张","下周要在课上做展示，准备时有点紧张，想了解学校有哪些支持渠道。"]],
  idea:[["自习室指引","第一次去公共自习室时绕了一圈。建议在楼梯口加一张楼层指引图。"],["闲置书交换","学期结束会剩下一些用不到的书，想在公寓公共区试办一次旧书交换。"]]
};
const FOLLOWUPS=["补充：下午时段也遇到了同样的情况。","补充：周三课后可以一起看看现场。","补充：已经看到回复，谢谢。"];
const REPLIES=["已记下具体情况，会先和楼层值班同事核对。","已和相关同事沟通，正在安排下一步。","已完成现场确认，可以查看处理结果。"];
const MINE=Object.create(null), CASES=Object.create(null);
const UI={role:"student",me:{role:"grid",building:BUILDINGS[2]},sel:null,filterLv:"all",filterSt:"open",submitCat:"logi",trackSel:null};
let sequence=0;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const dur=ms=>{const a=Math.abs(ms);if(a<H)return Math.max(1,Math.round(a/60000))+"分钟";if(a<2*D)return Math.round(a/H)+"小时";return Math.round(a/D)+"天";};
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
function newId(){return "LXQ-"+String(++sequence).padStart(4,"0");}

/* ---------- rules ---------- */
function kwLevel(r){
  const t=r.content||"";
  if(r.urgentSelf||KW_URGENT.some(w=>t.includes(w))) return {lv:"urgent",why:r.urgentSelf?"学生自评紧急":"内容含高风险关键词"};
  if(KW_KEY.some(w=>t.includes(w))) return {lv:"key",why:"内容含情绪或冲突关键词"};
  return {lv:"normal",why:"常规诉求"};
}
function allRecs(){return [...Object.values(MINE),...Object.values(CASES)];}
/* effective level: stored level, raised by repeat rule and by overdue response (derived, not written) */
function eff(r,all){
  let lv=r.level, notes=[];
  if(!r.manualLevel&&r.dorm&&all&&all.some(x=>x.id!==r.id&&x.building===r.building&&x.dorm===r.dorm&&x.category===r.category&&x.createdAt<r.createdAt&&r.createdAt-x.createdAt<=14*D)){
    if(LV_RANK[lv]<1){lv="key";notes.push("同一宿舍14天内同类诉求再次出现");}
  }
  let escAt=null;
  if(!r.respondedAt&&r.status!=="已办结"){
    let t=r.createdAt, cur=lv;
    while(cur!=="urgent"&&Date.now()>t+LV[cur].resp*H){t=t+LV[cur].resp*H;cur=cur==="normal"?"key":"urgent";escAt=escAt||t;}
    if(cur!==lv){notes.push(`超过首次响应时限，自动由“${LV[lv].n}”升级为“${LV[cur].n}”`);lv=cur;}
  }
  return {lv,escalated:!!escAt,escAt,notes};
}
function assigneesFor(r,lv){
  const a=new Set(r.extraAssignees||[]);
  if(lv==="urgent"){a.add("psych");a.add("office");a.add("counselor");}
  else if(lv==="key"){a.add("party");a.add("counselor");}
  else a.add("grid");
  if(r.category==="logi") a.add("logistics");
  if(r.category==="mood") a.add("psych");
  return [...a];
}
function canSeeContent(r,lv,role){ if(r.category!=="mood"&&lv!=="urgent") return true; return role==="psych"||role==="office"; }
function respDue(r,lv){return r.createdAt+LV[lv].resp*H;}
function resDue(r,lv){return r.createdAt+LV[lv].res*H;}

function writeRec(record,patch){Object.assign(record,patch);}
function guard(action,message){action();if(message)toast(message);render(false);}
function makeRecord(category,sample,building,options={}){
  const createdAt=options.time??Date.now();
  const record={id:newId(),createdAt,building,dorm:"",grade:"",category,content:EXAMPLES[category][sample][1],anonymous:true,contact:"",urgentSelf:!!options.urgent,source:options.source||"student",events:[],methods:[],result:"",rating:0,solved:null,respondedAt:null,resolvedAt:null,status:"待受理",collab:false,extraAssignees:[]};
  const grade=kwLevel(record);
  record.level=record.levelInit=grade.lv;
  record.events.push({t:createdAt,who:record.source==="staff"?"楼栋网格员":"学生",text:record.source==="staff"?"走访记录已建立":"提交诉求"});
  record.events.push({t:createdAt,who:"系统",sys:true,text:`自动分级为“${LV[grade.lv].n}”（${grade.why}），派发给：${assigneesFor(record,grade.lv).map(role=>ROLES[role].n).join("、")}`});
  return record;
}
function seed(){
  const started=Date.now();
  const fixtures=[
    {category:"live",sample:0,building:2,age:6,mine:true},
    {category:"idea",sample:0,building:2,age:72,mine:true,reply:5,finish:30,method:"服务改进",summary:"楼层指引已张贴在楼梯口。"},
    {category:"logi",sample:1,building:3,age:30,reply:3,source:"staff"},
    {category:"study",sample:1,building:0,age:12},
    {category:"mood",sample:0,building:2,age:19,reply:4},
    {category:"rel",sample:0,building:4,age:235,reply:2,finish:49,method:"分别谈话",summary:"小组一起重新确认了分工。",rating:4},
    {category:"logi",sample:0,building:1,age:538,reply:3,finish:23,method:"维修/服务改进",summary:"已调整楼梯照明感应范围。",rating:5},
    {category:"idea",sample:1,building:5,age:780,reply:6,finish:100,method:"服务改进",summary:"在阅读角试设了旧书交换架。",source:"staff"}
  ];
  for(const fixture of fixtures){
    const record=makeRecord(fixture.category,fixture.sample,BUILDINGS[fixture.building],{time:started-fixture.age*H,source:fixture.source});
    if(fixture.reply){record.respondedAt=record.createdAt+fixture.reply*H;record.status="处理中";record.events.push({t:record.respondedAt,who:"值班老师",text:"已受理并核对情况。"});}
    if(fixture.finish){Object.assign(record,{resolvedAt:record.createdAt+fixture.finish*H,status:"已办结",levelFinal:record.level,methods:[fixture.method],result:fixture.summary});record.events.push({t:record.resolvedAt,who:"值班老师",text:fixture.summary});}
    if(fixture.rating){Object.assign(record,{rating:fixture.rating,solved:true});record.events.push({t:record.resolvedAt+H,who:"学生",text:`回访评价：${fixture.rating}星，问题已解决。`});}
    (fixture.mine?MINE:CASES)[record.id]=record;
  }
}
function openDesk(record){
  const level=eff(record,allRecs()).lv;
  const roles=assigneesFor(record,level);
  const role=roles.includes("psych")?"psych":roles[0];
  UI.me={role,building:record.building};UI.sel=record.id;UI.filterSt="all";UI.filterLv="all";location.hash="todo";
}

function lvBadge(lv,escd){return `<span class="badge lv-${lv}">${LV[lv].n}${escd?" · 已升级":""}</span>`;}
function stBadge(r){const c={"待受理":"st-wait","处理中":"st-doing","已办结":"st-done"}[r.status]||"st-wait";return `<span class="badge ${c}">${r.status}</span>`;}
function dueInfo(r,lv,now){
  if(r.status==="已办结") return `<span class="due ok">已办结</span>`;
  if(!r.respondedAt){const left=respDue(r,lv)-now;return left<0?`<span class="due late">响应已超时 ${dur(left)}</span>`:`<span class="due ${left<6*H?"soon":"ok"}">响应剩余 ${dur(left)}</span>`;}
  const left=resDue(r,lv)-now;return left<0?`<span class="due late">办结已超时 ${dur(left)}</span>`:`<span class="due ${left<D?"soon":"ok"}">办结剩余 ${dur(left)}</span>`;
}
function timeline(r,studentView,e){
  const evs=(r.events||[]).slice();
  if(e&&e.escalated) evs.push({t:e.escAt,who:"系统",sys:true,text:e.notes.filter(n=>n.startsWith("超过")).join("；")+"，示例工单转至上一级"});
  return `<ol class="timeline">${evs.sort((a,b)=>a.t-b.t).map(ev=>`<li class="${ev.sys?"sys":""}"><time>${fmt(ev.t)} · ${esc(studentView&&ev.who!=="学生"&&ev.who!=="系统"?"处理老师":ev.who)}</time>${esc(studentView&&ev.sys&&ev.text.includes("派发给")?ev.text.replace(/（.*?）/,""):ev.text)}</li>`).join("")}</ol>`;
}

/* ---------- admin views ---------- */
function stats(){
  const L=staffList(), recs=L.map(x=>x.r);
  const resp=recs.filter(r=>r.respondedAt).map(r=>(r.respondedAt-r.createdAt)/H).sort((a,b)=>a-b);
  const middle=Math.floor(resp.length/2);const med=!resp.length?0:resp.length%2?resp[middle]:(resp[middle-1]+resp[middle])/2;
  const done=L.filter(x=>x.r.status==="已办结");
  const ontime=done.filter(x=>x.r.resolvedAt<=resDue(x.r,x.r.levelFinal||x.e.lv)).length;
  const rated=recs.filter(r=>r.rating);
  const sat=rated.length?rated.reduce((s,r)=>s+r.rating,0)/rated.length:0;
  const recur=done.filter(({r})=>r.dorm&&recs.some(x=>x!==r&&x.building===r.building&&x.dorm===r.dorm&&x.category===r.category&&x.createdAt>r.resolvedAt&&x.createdAt-r.resolvedAt<=14*D)).length;
  const active=recs.filter(r=>r.source==="staff").length;
  const escN=L.filter(x=>x.e.escalated||x.r.escalated).length;
  return {L,total:recs.length,open:recs.filter(r=>r.status!=="已办结").length,med,hasResp:resp.length>0,ontime:done.length?ontime/done.length:null,sat,ratedN:rated.length,recur:done.length?recur/done.length:null,active:recs.length?active/recs.length:null,escRate:recs.length?escN/recs.length:null,doneN:done.length};
}
function barList(pairs){const max=Math.max(1,...pairs.map(p=>p[1]));return `<div class="bars">${pairs.map(([k,v])=>`<div class="b"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><span class="n">${v}</span></div>`).join("")}</div>`;}
function trend(recs){
  const now=Date.now(), weeks=8, W=7*D;
  const counts=Array.from({length:weeks},(_,i)=>recs.filter(r=>r.createdAt>now-(weeks-i)*W&&r.createdAt<=now-(weeks-i-1)*W).length);
  const max=Math.max(4,...counts), w=560, h=180, px=40, py=20;
  const x=i=>px+i*((w-px-16)/(weeks-1)), y=v=>h-py-(v/max)*(h-2*py);
  const pts=counts.map((c,i)=>`${x(i).toFixed(1)},${y(c).toFixed(1)}`).join(" ");
  const ticks=[0,Math.round(max/2),max];
  return `<svg viewBox="0 0 ${w} ${h+24}" role="img" aria-label="近8周诉求数量：${counts.join("、")}" style="width:100%;height:auto">
    ${ticks.map(t=>`<line x1="${px}" x2="${w-16}" y1="${y(t)}" y2="${y(t)}" stroke="#E4DEF3"/><text x="${px-8}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="#6E6985">${t}</text>`).join("")}
    <polyline points="${pts}" fill="none" stroke="#921C95" stroke-width="3" stroke-linejoin="round"/>
    ${counts.map((c,i)=>`<circle cx="${x(i)}" cy="${y(c)}" r="4.5" fill="#fff" stroke="#921C95" stroke-width="2.5"><title>${c}条</title></circle><text x="${x(i)}" y="${h+14}" text-anchor="middle" font-size="12" fill="#6E6985">${i===weeks-1?"本周":(weeks-1-i)+"周前"}</text>`).join("")}
  </svg>`;
}

  const b=$("#copyCsv"); if(!b) return;
  b.addEventListener("click",()=>{
    const head=["演示编号","提交时间","楼栋","年级","类别","来源","是否匿名","初始等级","当前等级","是否超时升级","首次响应(小时)","办结(小时)","是否会商","处理方式","处理结果","满意度","是否解决"];
    const rows=staffList().map(({r,e})=>[r.id,new Date(r.createdAt).toISOString(),r.building,r.grade,CATN[r.category],r.source==="staff"?"主动发现":"学生提交",r.anonymous?"是":"否",LV[r.levelInit||r.level].n,LV[r.levelFinal||e.lv].n,(e.escalated||r.escalated)?"是":"否",r.respondedAt?((r.respondedAt-r.createdAt)/H).toFixed(1):"",r.resolvedAt?((r.resolvedAt-r.createdAt)/H).toFixed(1):"",r.collab?"是":"否",(r.methods||[]).join("/"),r.result||"",r.rating||"",r.solved==null?"":(r.solved?"是":"否")]);
    const csv=[head,...rows].map(a=>a.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    try{navigator.clipboard.writeText(csv).then(()=>toast(`已复制 ${rows.length} 条（不含内容、宿舍号、联系方式）`),()=>toast("复制失败"));}catch(e){toast("复制失败");}
  });
};
function vAll(){
  const now=Date.now();
  const list=staffList().sort((a,b)=>b.r.createdAt-a.r.createdAt);
  return `<div class="page-title"><div><h2>全部诉求</h2><p>共 ${list.length} 条虚构工单。点击编号以工作专班身份处理。</p></div></div>
  ${!list.length?`<div class="card empty">还没有诉求。</div>`:`<div class="card tbl" style="padding:0"><table><thead><tr><th>编号</th><th>时间</th><th>楼栋</th><th>类别</th><th>等级</th><th>状态</th><th>时限</th><th>满意度</th></tr></thead><tbody>
  ${list.map(({r,e})=>`<tr><td><button class="btn btn-g btn-sm" data-id="${r.id}" style="min-height:32px">${r.id}</button></td><td>${fmt(r.createdAt)}</td><td>${esc(r.building)}</td><td>${CATN[r.category]}${r.source==="staff"?" <span class='badge tag'>主动发现</span>":""}</td><td>${lvBadge(e.lv,e.escalated)}</td><td>${stBadge(r)}</td><td>${dueInfo(r,e.lv,now)}</td><td>${r.rating?r.rating+" 星":"—"}</td></tr>`).join("")}
  </tbody></table></div>`}`;
}
bind.all=function(){
  document.querySelectorAll("#view button[data-id]").forEach(b=>b.addEventListener("click",()=>{UI.me={role:"office",building:UI.me.building};UI.sel=b.dataset.id;UI.filterSt="all";UI.filterLv="all";location.hash="todo";}));
};

/* ---------- boot ---------- */
seed();
render(true);
})();

</script>
